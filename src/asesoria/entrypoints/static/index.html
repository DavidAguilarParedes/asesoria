<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AsesorIA</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7385;
    --line: #e2e5ea; --accent: #1f5fbf; --user: #e8f0fc; --warn: #fff6e0;
    --warn-line: #e8c46a; --ok: #1e7f4f; --no: #b3261e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
           padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0 8px 0 0; }
  header .note { color: var(--muted); font-size: 13px; margin-left: auto; }
  select, button, textarea { font: inherit; }
  select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  main { max-width: 820px; margin: 0 auto; padding: 16px; padding-bottom: 120px; }
  .msg { margin: 12px 0; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap;
         background: var(--panel); border: 1px solid var(--line); }
  .msg.user { background: var(--user); border-color: transparent; margin-left: 15%; }
  .msg.blocked { color: var(--muted); font-style: italic; }
  .msg.error { color: var(--no); }
  .tools { margin-top: 8px; font-size: 12px; color: var(--muted); white-space: normal; }
  .tools summary { cursor: pointer; }
  .tools li { font-family: ui-monospace, Consolas, monospace; }
  .order { margin: 12px 0; padding: 12px 14px; border-radius: 10px;
           background: var(--warn); border: 1px solid var(--warn-line); }
  .order h2 { font-size: 14px; margin: 0 0 6px; letter-spacing: .03em; }
  .order dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0 0 10px; }
  .order dt { color: var(--muted); }
  .order dd { margin: 0; }
  .order button { padding: 6px 14px; border-radius: 6px; border: 0; color: #fff; cursor: pointer; margin-right: 8px; }
  .order .yes { background: var(--ok); }
  .order .no { background: var(--no); }
  .order .done { font-weight: 600; }
  form { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel);
         border-top: 1px solid var(--line); padding: 12px 16px; }
  form .row { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; height: 46px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
  form button { padding: 0 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .typing { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>AsesorIA</h1>
  <label>Cliente <select id="client"></select></label>
  <button id="reset" type="button">Nueva sesión</button>
  <span class="note">Demo con paper trading. No es asesoría de inversión real.</span>
</header>
<main id="log"></main>
<form id="form">
  <div class="row">
    <textarea id="input" placeholder="Escribe tu consulta…" required></textarea>
    <button id="send">Enviar</button>
  </div>
</form>
<script>
const log = document.getElementById("log");
const input = document.getElementById("input");
const send = document.getElementById("send");
const clientSel = document.getElementById("client");
let sessionId = null;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function scroll() { window.scrollTo(0, document.body.scrollHeight); }

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                               body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}

function renderTools(box, reply) {
  if (!reply.tool_calls.length && !reply.model_calls.length) return;
  const d = el("details", "tools");
  const secs = reply.model_calls.reduce((a, m) => a + m.ms, 0) / 1000;
  d.append(el("summary", "", `${reply.tool_calls.length} tools · ${reply.model_calls.length} llamadas al modelo · ${secs.toFixed(1)} s`));
  const ul = el("ul");
  for (const t of reply.tool_calls) {
    const args = Object.entries(t.arguments).filter(([, v]) => v !== null)
      .map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", ");
    ul.append(el("li", "", `${t.tool}(${args}) · ${t.ms} ms${t.riesgo ? " · riesgo " + t.riesgo : ""}${t.ok ? "" : " · falló"}`));
  }
  d.append(ul);
  box.append(d);
}

function renderOrder(order) {
  const r = order.resumen;
  const card = el("div", "order");
  card.append(el("h2", "", "ORDEN PENDIENTE DE CONFIRMACIÓN"));
  const dl = el("dl");
  const rows = [
    ["Operación", `Comprar ${r.cantidad} ${r.simbolo} (mercado, ${r.cuenta})`],
    ["Precio estimado", `USD ${r.precio_usd}`],
    ["Costo estimado", `USD ${r.costo_estimado_usd}`],
    ["% del portafolio", `${r.porcentaje_del_portafolio}%`],
    ["Idoneidad", r.idoneidad],
  ];
  for (const [k, v] of rows) { dl.append(el("dt", "", k), el("dd", "", v ?? "—")); }
  card.append(dl);
  const actions = el("div");
  const yes = el("button", "yes", "Aprobar");
  const no = el("button", "no", "Rechazar");
  yes.type = no.type = "button";
  const decide = async (approved) => {
    yes.disabled = no.disabled = true;
    actions.replaceChildren(el("span", "done", approved ? "Aprobada por el usuario" : "Rechazada por el usuario"));
    await call(() => post("/chat/approve", { session_id: sessionId, approval_id: order.approval_id, approved }));
  };
  yes.onclick = () => decide(true);
  no.onclick = () => decide(false);
  actions.append(yes, no);
  card.append(actions);
  log.append(card);
}

function renderReply(reply) {
  sessionId = reply.session_id;
  const text = reply.text || (reply.pending.length ? "Te propongo esta orden. Revísala antes de confirmar:" : "");
  const box = el("div", "msg" + (reply.status === "blocked" ? " blocked" : ""), text);
  renderTools(box, reply);
  log.append(box);
  reply.pending.forEach(renderOrder);
  scroll();
}

async function call(fn) {
  send.disabled = true;
  const typing = el("div", "typing", "AsesorIA está pensando…");
  log.append(typing); scroll();
  try { renderReply(await fn()); }
  catch (e) { log.append(el("div", "msg error", "Error: " + e.message)); }
  finally { typing.remove(); send.disabled = false; input.focus(); scroll(); }
}

document.getElementById("form").onsubmit = (ev) => {
  ev.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  log.append(el("div", "msg user", message));
  input.value = "";
  call(() => post("/chat", { message, session_id: sessionId, client_id: clientSel.value || null }));
};

input.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); document.getElementById("form").requestSubmit(); }
});

function reset() { sessionId = null; log.replaceChildren(); input.focus(); }
document.getElementById("reset").onclick = reset;
clientSel.onchange = reset;

fetch("/clients").then(r => r.json()).then(list => {
  for (const c of list) {
    const o = el("option", "", `${c.client_id} · ${c.risk_profile} · USD ${c.portfolio_value_usd.toLocaleString()}`);
    o.value = c.client_id;
    clientSel.append(o);
  }
  clientSel.value = list.some(c => c.client_id === "c-002") ? "c-002" : (list[0]?.client_id ?? "");
});
</script>
</body>
</html>

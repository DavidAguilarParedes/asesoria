[project]
name = "asesoria"
version = "0.1.0"
description = "Agente asesor de inversiones con RAG, MCP de Alpaca (paper trading) y agente evaluador"
readme = "README.md"
authors = [
    { name = "David Aguilar", email = "aguilar.david@pucp.edu.pe" }
]
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.26.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "mcp>=2.2.0,<3",
    "openai>=3.55.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "pyyaml>=6.0.3",
    "qdrant-client[fastembed]>=1.20.0",
    "typer>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
asesoria = "asesoria.entrypoints.cli:app"

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
]
eval = [
    "ragas>=0.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asesoria", "src/evaluator"]

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.importlinter]
root_packages = ["asesoria"]

[[tool.importlinter.contracts]]
name = "Capas de la arquitectura"
type = "layers"
layers = [
    "asesoria.entrypoints",
    "asesoria.application",
    "asesoria.domain",
]

[[tool.importlinter.contracts]]
name = "El dominio no depende de la infraestructura"
type = "forbidden"
source_modules = ["asesoria.domain"]
forbidden_modules = ["asesoria.infrastructure"]

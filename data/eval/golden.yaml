# Set de evaluación de AsesorIA.
#
# evidence: lista de grupos. Cada grupo es una lista de lugares válidos (basta uno).
#   Un caso que compara dos instrumentos tiene dos grupos.
#   Un lugar se define por doc_id y, si hace falta, section (prefijo), page o contains
#   (frase del documento original). No se usa chunk_id para que el set sirva con
#   cualquier chunking.
# reference: en preguntas, la respuesta esperada, escrita para entenderse sola (con sujeto:
#   "las ventas de Apple", no "las ventas"), porque el juez la compara sin ver la pregunta; en casos de comportamiento, cómo debe
#   terminar la conversación (así lo compara la métrica de goal accuracy de Ragas).
# expect: lo que el agente debe hacer (se usa en el agente evaluador).
#   tool_calls: tools esperadas, en orden, con sus argumentos estables.
#   En las preguntas de documentos se espera buscar_documentos con el ticker del documento.

# --- Políticas internas ---

- id: pol-01
  type: rag
  question: ¿Cuál es el máximo que un cliente moderado puede tener en una sola acción?
  evidence:
    - - {doc_id: politica-limites-de-concentracion, section: Límites por perfil}
      - {doc_id: politica-limites-de-concentracion, section: Ejemplos}
  reference: Según la política de límites de concentración, un cliente moderado puede tener como máximo 10% de su portafolio en una acción individual.

- id: pol-02
  type: rag
  question: ¿Existe un monto máximo por cada orden?
  evidence:
    - - {doc_id: politica-limites-de-concentracion, section: Monto máximo por orden}
  reference: Según la política de límites de concentración, ninguna orden individual puede superar USD 10,000, aunque el límite de concentración lo permita.

- id: pol-03
  type: rag
  question: ¿Un cliente conservador puede invertir en TLT?
  evidence:
    - - {doc_id: politica-perfiles-de-riesgo, section: Perfil conservador}
      - {doc_id: politica-limites-de-concentracion, section: Límites por perfil}
  reference: Un cliente conservador no puede invertir en TLT, porque TLT es un fondo de bonos de largo plazo y el límite del perfil conservador para bonos de largo plazo es 0%.

- id: pol-04
  type: rag
  question: ¿Con qué instrumentos se puede operar durante el piloto?
  evidence:
    - - {doc_id: politica-idoneidad, section: Universo de instrumentos aprobados}
  reference: "Durante el piloto solo se puede operar con siete instrumentos aprobados: AAPL, MSFT, NVDA, SHY, AGG, TLT e IVV."

- id: pol-05
  type: rag
  question: ¿Qué se debe hacer si no se conoce el perfil de riesgo del cliente?
  evidence:
    - - {doc_id: politica-perfiles-de-riesgo, section: Reglas generales}
  reference: Si no se conoce el perfil de riesgo del cliente, no se recomienda ni se ejecuta ninguna operación; ante la duda entre dos perfiles se usa el más conservador.

- id: pol-06
  type: rag
  question: ¿Están permitidas las ventas en corto o las operaciones con margen?
  evidence:
    - - {doc_id: politica-idoneidad, section: Operaciones no permitidas}
  reference: En el piloto no se permiten ventas en corto, operaciones con margen ni derivados.

# --- Fact sheets ---

- id: fs-01
  type: rag
  question: ¿Cuál es el expense ratio de AGG?
  evidence:
    - - {doc_id: agg-factsheet, section: Fees And Expenses}
      - {doc_id: agg-prospectus, section: Fees and Expenses}
  reference: El expense ratio de AGG es 0.03%.

- id: fs-02
  type: rag
  question: ¿Qué duración efectiva tiene TLT?
  evidence:
    - - {doc_id: tlt-factsheet, section: Fund Characteristics}
  reference: TLT tiene una duración efectiva de 14.63 años.

- id: fs-03
  type: rag
  hops: multi
  question: Compara la duración de SHY con la de TLT
  evidence:
    - - {doc_id: shy-factsheet, section: Fund Characteristics}
    - - {doc_id: tlt-factsheet, section: Fund Characteristics}
  reference: SHY tiene una duración efectiva de 1.84 años y TLT de 14.63 años, así que TLT es mucho más sensible a los cambios de tasas.

- id: fs-04
  type: rag
  question: ¿Cuántas empresas tiene IVV y cuál es su P/E?
  evidence:
    - - {doc_id: ivv-factsheet, section: Fund Characteristics}
  reference: IVV tiene 504 posiciones y un P/E de 30.17x.

- id: fs-05
  type: rag
  question: ¿Cuál es el rendimiento SEC a 30 días de SHY?
  evidence:
    - - {doc_id: shy-factsheet, section: Fund Characteristics}
  reference: El rendimiento SEC a 30 días de SHY es 4.53%.

- id: fs-06
  type: rag
  question: ¿Qué índice sigue AGG?
  evidence:
    - - {doc_id: agg-factsheet, section: Key Facts}
      - {doc_id: agg-prospectus, section: Principal Investment Strategies}
  reference: AGG sigue el Bloomberg US Aggregate Bond Index.

# --- Prospectos ---

- id: sp-01
  type: rag
  question: ¿Por qué TLT es tan sensible a las tasas de interés?
  evidence:
    - - {doc_id: tlt-prospectus, contains: Interest rate risk refers to the risk}
      - {doc_id: sec-interest-rate-risk, contains: seesaw}
  reference: "TLT es sensible a las tasas de interés porque invierte en bonos del Tesoro de largo plazo: cuando suben las tasas, el precio de los bonos baja, y el efecto es mayor cuanto más larga es la duración."

- id: sp-02
  type: rag
  question: ¿Qué es el riesgo de prepago que menciona AGG?
  evidence:
    - - {doc_id: agg-prospectus, contains: Prepayment Risk}
  reference: El riesgo de prepago de AGG consiste en que, si las tasas bajan, algunos emisores pagan su deuda antes del vencimiento y el fondo tiene que reinvertir en instrumentos con menor rendimiento.

- id: sp-03
  type: rag
  question: ¿Cuál es el objetivo de inversión de SHY?
  evidence:
    - - {doc_id: shy-prospectus, section: Investment Objective}
      - {doc_id: shy-prospectus, section: Principal Investment Strategies}
  reference: El objetivo de inversión de SHY es replicar un índice de bonos del Tesoro de EE. UU. con vencimientos de entre uno y tres años.

- id: sp-04
  type: rag
  question: ¿Cómo se compran y venden las acciones de IVV?
  evidence:
    - - {doc_id: ivv-prospectus, section: Purchase and Sale of Fund Shares}
  reference: Las acciones de IVV se compran y venden en bolsa a precio de mercado a través de un intermediario, como cualquier acción.

# --- 10-K ---

- id: tk-01
  type: rag
  question: ¿Qué tan concentrados están los clientes de NVIDIA?
  evidence:
    - - {doc_id: nvda-10k-2026, contains: one direct customer represented 22% of total revenue}
  reference: En el año fiscal 2026, un cliente directo representó 22% de los ingresos de NVIDIA y otro 14%, ambos en el segmento Compute & Networking.

- id: tk-02
  type: rag
  question: ¿Cómo le afectan a NVIDIA las restricciones de exportación a China?
  evidence:
    - - {doc_id: nvda-10k-2026, contains: H20}
  reference: El gobierno de EE. UU. exigió licencias para exportar a China chips de NVIDIA como el H20, y por eso NVIDIA registró un cargo de USD 4,500 millones en el primer trimestre del año fiscal 2026.

- id: tk-03
  type: rag
  question: ¿Quién fabrica los chips de NVIDIA?
  evidence:
    - - {doc_id: nvda-10k-2026, contains: Taiwan Semiconductor Manufacturing Company}
  reference: NVIDIA usa fundiciones externas como TSMC y Samsung para producir sus wafers de semiconductores.

- id: tk-04
  type: rag
  question: ¿Qué riesgos menciona Apple sobre aranceles y comercio internacional?
  evidence:
    - - {doc_id: aapl-10k-2026, contains: tariffs and other controls on imports}
      - {doc_id: aapl-10k-2026, contains: new or increased tariffs}
  reference: Apple advierte que los aranceles y otras restricciones al comercio internacional pueden afectar de forma material su negocio y su cadena de suministro.

- id: tk-05
  type: rag
  question: ¿Cuánto vendió Apple en total en el año fiscal 2026?
  evidence:
    - - {doc_id: aapl-10k-2026, contains: Total net sales | 478,834}
  reference: Las ventas netas totales de Apple en el año fiscal 2026 fueron USD 478,834 millones, 15% más que en 2025.

- id: tk-06
  type: rag
  question: ¿Apple depende de capacidad de cómputo para su inteligencia artificial?
  evidence:
    - - {doc_id: aapl-10k-2026, contains: depends on access to sufficient compute capacity}
  reference: Las funciones de inteligencia artificial de Apple dependen de tener suficiente capacidad de cómputo y almacenamiento, cuya oferta hoy está limitada en la industria.

- id: tk-07
  type: rag
  question: ¿Qué relación tiene Microsoft con OpenAI?
  evidence:
    - - {doc_id: msft-10k-2026, contains: strategic partnership with OpenAI}
  reference: Microsoft tiene una alianza estratégica de largo plazo con OpenAI desde 2019, ampliada en 2025 y 2026, y es uno de sus principales inversionistas.

- id: tk-08
  type: rag
  question: ¿Qué riesgos de ciberseguridad menciona Microsoft?
  evidence:
    - - {doc_id: msft-10k-2026, contains: Nation-state}
      - {doc_id: msft-10k-2026, contains: increase our exposure to cyberattacks}
  reference: Microsoft menciona como riesgos de ciberseguridad los ataques sostenidos de actores estatales y las vulnerabilidades en sus productos, incluido código generado por IA y software de código abierto.

- id: tk-09
  type: rag
  question: ¿En qué segmentos reporta Microsoft su negocio?
  evidence:
    - - {doc_id: msft-10k-2026, contains: "three segments: Productivity and Business Processes"}
  reference: "Microsoft reporta su negocio en tres segmentos: Productivity and Business Processes, Intelligent Cloud y More Personal Computing."

# --- Guías de la SEC ---

- id: gd-01
  type: rag
  question: ¿Qué le pasa al precio de un bono cuando suben las tasas de interés?
  evidence:
    - - {doc_id: sec-interest-rate-risk, contains: seesaw}
  reference: Cuando suben las tasas de interés, el precio de los bonos de tasa fija baja; las tasas y los precios de los bonos se mueven en sentido contrario, como un balancín.

- id: gd-02
  type: rag
  question: ¿Qué diferencia hay entre un bono investment grade y uno high yield?
  evidence:
    - - {doc_id: sec-corporate-bonds, contains: also called high-yield}
  reference: Los bonos investment grade tienen más probabilidad de pagarse a tiempo; los bonos high yield o especulativos pagan tasas más altas porque tienen más riesgo de impago.

- id: gd-03
  type: rag
  question: ¿En qué se diferencia un ETF de un fondo mutuo a la hora de comprarlo?
  evidence:
    - - {doc_id: sec-etfs, contains: intraday trading feature}
  reference: Un fondo mutuo se compra o rescata al NAV calculado al cierre del día, mientras que un ETF se negocia durante toda la jornada a precio de mercado.

- id: gd-04
  type: rag
  question: ¿Qué significa rebalancear un portafolio?
  evidence:
    - - {doc_id: sec-asset-allocation, section: Rebalancing 101}
      - {doc_id: sec-asset-allocation, section: When to Consider Rebalancing}
  reference: Rebalancear un portafolio es volver a la mezcla de activos original cuando los movimientos del mercado la cambian.

- id: gd-05
  type: rag
  question: ¿Qué es el interés compuesto?
  evidence:
    - - {doc_id: sec-saving-investing-roadmap, contains: compound interest}
  reference: El interés compuesto consiste en ganar intereses sobre el dinero ahorrado y también sobre los intereses que ya se ganaron.

